name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'next.config.*'
      - 'package.json'
      - 'public/**'
      - 'src/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Login To GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Image Tag And Name
        id: image
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-8)
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build And Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.image.outputs.TAG }}
            ${{ steps.image.outputs.IMAGE_NAME }}:latest
