name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'next.config.*'
      - 'package.json'
      - 'public/**'
      - 'src/**'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'bun.lock*'
      - 'bunfig.toml'
      - 'tsconfig*.json'
      - 'next-env.d.ts'
      - '*.config.*'
      - '.npmrc'
      - '.bun-version'
      - '.node-version'
      - '.nvmrc'
      - '.github/workflows/build.yaml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Filter Changed Files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
              ':(glob)next.config.*' \
              ':(glob)package.json' \
              ':(glob)public/**' \
              ':(glob)src/**' \
              ':(glob)Dockerfile*' \
              ':(glob).dockerignore' \
              ':(glob)bun.lock*' \
              ':(glob)bunfig.toml' \
              ':(glob)tsconfig*.json' \
              ':(glob)next-env.d.ts' \
              ':(glob)*.config.*' \
              ':(glob).npmrc' \
              ':(glob).bun-version' \
              ':(glob).node-version' \
              ':(glob).nvmrc' \
              ':(glob).github/workflows/build.yaml'; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            status=$?

            if (( status != 1 )); then
              exit "$status"
            fi

            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Login To GHCR
        if: ${{ steps.changes.outputs.run == 'true' && github.event_name == 'push' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Image Tag And Name
        if: ${{ steps.changes.outputs.run == 'true' }}
        id: image
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-8)
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build And Push Docker Image
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.image.outputs.TAG }}
            ${{ steps.image.outputs.IMAGE_NAME }}:latest
